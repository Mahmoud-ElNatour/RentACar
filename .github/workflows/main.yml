Import-Module WebAdministration

$sitePath = "${{ env.SITE_PATH }}"
$publishPath = "${{ env.PUBLISH_PATH }}"
$appPool = "${{ env.APP_POOL }}"

Stop-WebAppPool -Name $appPool

# Put app offline (optional with app pool stopped, but fine)
"offline" | Out-File (Join-Path $sitePath "app_offline.htm") -Encoding ASCII

robocopy $publishPath $sitePath /MIR /R:2 /W:2 /NFL /NDL /NP
$rc = $LASTEXITCODE
if ($rc -ge 8) { throw "Robocopy failed with exit code $rc" }

Remove-Item (Join-Path $sitePath "app_offline.htm") -ErrorAction SilentlyContinue
Start-WebAppPool -Name $appPool

exit 0
