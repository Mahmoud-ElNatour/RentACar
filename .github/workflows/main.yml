name: Deploy to IIS (Windows Server)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    env:
      SITE_PATH: "C:\\inetpub\\wwwroot\\MyApp"
      PUBLISH_PATH: "C:\\deploy\\MyApp\\publish"
      APP_POOL: "MyAppPool"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish (Web)
        run: dotnet publish .\RentACar.Web\RentACar.Web.csproj -c Release -o "${{ env.PUBLISH_PATH }}" --no-build

      - name: Deploy to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration

          $sitePath = "${{ env.SITE_PATH }}"
          $publishPath = "${{ env.PUBLISH_PATH }}"
          $appPool = "${{ env.APP_POOL }}"

          # Stop app pool (ignore if already stopped)
          try { Stop-WebAppPool -Name $appPool } catch { }

          Start-Sleep -Seconds 2

          # Put app offline
          "offline" | Out-File (Join-Path $sitePath "app_offline.htm") -Encoding ASCII

          # Copy files (Robocopy: 0..7 = success, 8+ = failure)
          robocopy $publishPath $sitePath /MIR /R:2 /W:2 /NFL /NDL /NP
          $rc = $LASTEXITCODE
          if ($rc -ge 8) { throw "Robocopy failed with exit code $rc" }

          # Remove offline file before starting
          Remove-Item (Join-Path $sitePath "app_offline.htm") -ErrorAction SilentlyContinue

          # Start app pool with retries (fixes 0x80070425)
          $maxTries = 10
          for ($i = 1; $i -le $maxTries; $i++) {
            try {
              Start-WebAppPool -Name $appPool
              break
            } catch {
              if ($i -eq $maxTries) { throw }
              Start-Sleep -Seconds 2
            }
          }
