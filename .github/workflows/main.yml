name: Deploy to IIS (Windows Server)

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: self-hosted

    # Prevent infinite loop when workflow pushes the auto migration commit
    if: github.actor != 'github-actions[bot]'

    env:
      SITE_PATH: "C:\\inetpub\\wwwroot\\MyApp"
      PUBLISH_PATH: "C:\\deploy\\MyApp\\publish"
      APP_POOL: "MyAppPool"

      # Adjust to your solution structure
      WEB_CSPROJ: ".\\RentACar.Web\\RentACar.Web.csproj"
      INFRA_CSPROJ: ".\\RentACar.Infrastructure\\RentACar.Infrastructure.csproj"

      # Used for naming the migration
      MIGRATION_PREFIX: "Auto"

    steps:
      # 1) Pull latest code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Setup .NET 8 to writable folder
      - name: Setup .NET 8 (no admin)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet

      - name: Add dotnet to PATH
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "${{ runner.temp }}\dotnet"

      - name: Set DOTNET_ROOT
        shell: powershell
        run: |
          "DOTNET_ROOT=${{ runner.temp }}\dotnet" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check dotnet visible to runner
        shell: powershell
        run: |
          where.exe dotnet
          dotnet --info

      # 3) Install EF Tool (dotnet-ef)
      - name: Install dotnet-ef
        shell: powershell
        run: |
          dotnet tool update --global dotnet-ef
          $toolPath = "$env:USERPROFILE\.dotnet\tools"
          Add-Content -Path $env:GITHUB_PATH -Value $toolPath
          dotnet ef --version

      # 4) Restore + Build
      - name: Restore
        shell: powershell
        run: dotnet restore

      - name: Build
        shell: powershell
        run: dotnet build -c Release --no-restore

      # 5) Detect model changes & auto-add migration only if needed
      - name: Auto Add Migration (only if there are changes)
        id: automig
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $stamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $migName = "${{ env.MIGRATION_PREFIX }}_$stamp"

          # Try to add migration. If no changes, EF returns: "No changes were found..."
          $output = & dotnet ef migrations add $migName `
            --project "${{ env.INFRA_CSPROJ }}" `
            --startup-project "${{ env.WEB_CSPROJ }}" 2>&1

          $output | Out-String | Write-Host

          if ($output -match "No changes were found") {
            Write-Host "✅ No model changes. Skipping migration commit."
            "MIGRATION_CREATED=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }

          # If migration files were created, commit & push them
          git status --porcelain

          if ((git status --porcelain).Length -gt 0) {
            git add .
            git commit -m "chore(db): auto migration $migName [skip ci]"
            git push
            Write-Host "✅ Migration committed and pushed."
            "MIGRATION_CREATED=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "ℹ️ EF ran but no files changed. Skipping push."
            "MIGRATION_CREATED=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      # 6) Always update DB (will be no-op if nothing pending)
      - name: Update Database
        shell: powershell
        run: |
          # Optional sanity check: fail fast if connection string is missing
          if ([string]::IsNullOrWhiteSpace($env:ConnectionStrings__DefaultConnection)) {
            Write-Host "❌ ConnectionStrings__DefaultConnection is not set on this runner."
            exit 1
          }

          dotnet ef database update `
            --project "${{ env.INFRA_CSPROJ }}" `
            --startup-project "${{ env.WEB_CSPROJ }}"

      # 7) Publish
      - name: Ensure publish folder exists
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.PUBLISH_PATH }}" | Out-Null

      - name: Publish (Web)
        shell: powershell
        run: dotnet publish "${{ env.WEB_CSPROJ }}" -c Release -o "${{ env.PUBLISH_PATH }}" --no-build

      # 8) Deploy to IIS
      - name: Deploy to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration
          $sitePath = "${{ env.SITE_PATH }}"
          $publishPath = "${{ env.PUBLISH_PATH }}"
          $appPool = "${{ env.APP_POOL }}"

          try { Stop-WebAppPool -Name $appPool } catch { }
          Start-Sleep -Seconds 2

          "offline" | Out-File (Join-Path $sitePath "app_offline.htm") -Encoding ASCII -Force

          robocopy $publishPath $sitePath /MIR /R:2 /W:2 /NFL /NDL /NP
          $rc = $LASTEXITCODE
          if ($rc -ge 8) { throw "Robocopy failed with exit code $rc" }

          $global:LASTEXITCODE = 0

          Remove-Item (Join-Path $sitePath "app_offline.htm") -ErrorAction SilentlyContinue

          $maxTries = 10
          for ($i = 1; $i -le $maxTries; $i++) {
            try {
              Start-WebAppPool -Name $appPool
              break
            } catch {
              if ($i -eq $maxTries) { throw }
              Start-Sleep -Seconds 2
            }
          }
