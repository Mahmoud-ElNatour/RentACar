name: Deploy to IIS (Windows Server)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    env:
      SITE_PATH: "C:\\inetpub\\wwwroot\\MyApp"
      PUBLISH_PATH: "C:\\deploy\\MyApp\\publish"
      APP_POOL: "MyAppPool"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install .NET 8 to a writable folder (avoids Program Files permission issues)
      - name: Setup .NET 8 (no admin)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet

      # Put installed dotnet on PATH for all following steps
      - name: Add dotnet to PATH
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "${{ runner.temp }}\dotnet"

      # (Optional but recommended) Ensure DOTNET_ROOT points to the installed SDK
      - name: Set DOTNET_ROOT
        shell: powershell
        run: |
          "DOTNET_ROOT=${{ runner.temp }}\dotnet" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Diagnostics (now dotnet should be visible)
      - name: Check dotnet visible to runner
        shell: powershell
        run: |
          where.exe dotnet
          dotnet --info

      - name: Restore
        shell: powershell
        run: dotnet restore

      - name: Build
        shell: powershell
        run: dotnet build -c Release --no-restore

      # Ensure publish folder exists
      - name: Ensure publish folder exists
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.PUBLISH_PATH }}" | Out-Null

      - name: Publish (Web)
        shell: powershell
        run: dotnet publish .\RentACar.Web\RentACar.Web.csproj -c Release -o "${{ env.PUBLISH_PATH }}" --no-build

      - name: Apply Database Migrations
        shell: powershell
        env:
          # The Runner Service often cannot see System Environment Variables.
          # We explicitly inject the connection string here.
          # REPLACE '${{ secrets.PROD_CONNECTION_STRING }}' with your actual connection string if you don't have secrets set up.
          ConnectionStrings__DefaultConnection: ${{ secrets.PROD_CONNECTION_STRING }}
        run: |
          # Install dotnet-ef locally (avoids global tool downgrade issues + PATH problems)
          $toolPath = Join-Path $env:RUNNER_TEMP "dotnet-tools"
          New-Item -ItemType Directory -Force -Path $toolPath | Out-Null

          dotnet tool install dotnet-ef --version 8.0.* --tool-path $toolPath --ignore-failed-sources

          # Make it available immediately in THIS step
          $env:PATH = "$toolPath;$env:PATH"

          # Verify
          dotnet-ef --version

          # Run migrations
          dotnet-ef database update --project .\RentACar.Infrastructure\RentACar.Infrastructure.csproj --startup-project .\RentACar.Web\RentACar.Web.csproj --context ApplicationDbContext --configuration Release --no-build
          dotnet-ef database update --project .\RentACar.Infrastructure\RentACar.Infrastructure.csproj --startup-project .\RentACar.Web\RentACar.Web.csproj --context RentACarDbContext --configuration Release --no-build

      - name: Deploy to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration
          $sitePath = "${{ env.SITE_PATH }}"
          $publishPath = "${{ env.PUBLISH_PATH }}"
          $appPool = "${{ env.APP_POOL }}"

          try { Stop-WebAppPool -Name $appPool } catch { }
          Start-Sleep -Seconds 2

          # Put the site offline during file copy (prevents locked DLL issues)
          "offline" | Out-File (Join-Path $sitePath "app_offline.htm") -Encoding ASCII -Force

          robocopy $publishPath $sitePath /MIR /R:2 /W:2 /NFL /NDL /NP
          $rc = $LASTEXITCODE
          if ($rc -ge 8) { throw "Robocopy failed with exit code $rc" }

          # Reset robocopy exit code so the step doesn't fail
          $global:LASTEXITCODE = 0

          Remove-Item (Join-Path $sitePath "app_offline.htm") -ErrorAction SilentlyContinue

          $maxTries = 10
          for ($i = 1; $i -le $maxTries; $i++) {
            try {
              Start-WebAppPool -Name $appPool
              break
            } catch {
              if ($i -eq $maxTries) { throw }
              Start-Sleep -Seconds 2
            }
          }
