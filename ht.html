<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Prestige Rent - Top Navigation</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d4af35",
                        "primary-dark": "#0a0c0e",
                        "background-light": "#f8f7f6",
                        "background-dark": "#0a0c0e", // Matched with user request
                        "surface-dark": "#16181a",
                        "border-dark": "#2a2d30",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }

        /* Custom scrollbar for dropdowns if needed */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 2px;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-white">
    <!-- Wrapper for demonstration (simulating the full app layout) -->
    <div class="flex h-screen w-full flex-col">
        <!-- Top Navigation Bar -->
        <header class="sticky top-0 z-50 w-full border-b border-border-dark bg-surface-dark/95 backdrop-blur-sm">
            <div class="px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 items-center justify-between">
                    <!-- Left Section: Toggle & Brand -->
                    <div class="flex items-center gap-4 lg:gap-8">
                        <!-- Sidebar Toggle -->
                        <button
                            class="group -m-2.5 inline-flex items-center justify-center rounded-md p-2.5 text-gray-400 hover:text-primary transition-colors duration-200"
                            type="button">
                            <span class="sr-only">Open sidebar</span>
                            <span
                                class="material-symbols-outlined text-3xl group-hover:scale-105 transition-transform">menu</span>
                        </button>
                        <!-- Brand Logo -->
                        <div class="flex items-center gap-3">
                            <div
                                class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-primary to-yellow-600 text-black shadow-[0_0_15px_rgba(212,175,53,0.3)]">
                                <span class="material-symbols-outlined font-bold text-xl">directions_car</span>
                            </div>
                            <h1 class="hidden sm:block text-lg font-bold tracking-tight text-white font-display">
                                Prestige Rent
                            </h1>
                        </div>
                    </div>
                    <!-- Middle Section: Global Links (Desktop) -->
                    <nav class="hidden md:flex flex-1 justify-center px-8">
                        <div
                            class="flex items-center gap-1 bg-background-dark/50 rounded-full p-1 border border-border-dark">
                            <a class="px-4 py-1.5 text-sm font-medium text-white bg-primary/20 rounded-full text-primary border border-primary/30 transition-all duration-200"
                                href="#">
                                Browse Cars
                            </a>
                            <a class="px-4 py-1.5 text-sm font-medium text-gray-400 hover:text-white transition-colors duration-200"
                                href="#">
                                My Bookings
                            </a>
                            <a class="px-4 py-1.5 text-sm font-medium text-gray-400 hover:text-white transition-colors duration-200"
                                href="#">
                                Dashboard
                            </a>
                        </div>
                    </nav>
                    <!-- Right Section: Actions & Profile -->
                    <div class="flex items-center gap-4 sm:gap-6">
                        <!-- Search Trigger (Optional but good for nav) -->
                        <button class="text-gray-400 hover:text-primary transition-colors">
                            <span class="material-symbols-outlined">search</span>
                        </button>
                        <!-- Notifications -->
                        <button class="relative text-gray-400 hover:text-primary transition-colors group">
                            <span class="material-symbols-outlined">notifications</span>
                            <!-- Notification Badge -->
                            <span class="absolute top-0.5 right-0.5 flex h-2 w-2">
                                <span
                                    class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
                            </span>
                        </button>
                        <!-- Divider -->
                        <div class="hidden sm:block h-6 w-px bg-border-dark"></div>
                        <!-- User Profile Dropdown Trigger -->
                        <div class="relative flex items-center">
                            <button
                                class="flex items-center gap-3 rounded-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-dark group"
                                id="user-menu-button" type="button">
                                <div class="relative">
                                    <div class="h-9 w-9 overflow-hidden rounded-full border-2 border-primary/30 shadow-sm"
                                        data-alt="User profile picture showing a person in professional attire"
                                        style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCyo1wurroAGphii8M94hkAd-Pc-IHXIXIRP4RI8DMwk0_SulenDNri0H4HhPzjgABkhLi-a4O4EYZg-Y2IcL_m_vNQghiAOG8giFuiWa8uisPTEc8Y-MdWUbGailrRw-hPVu8b_1Pv3jlybw1FDbkB7WSeK_GOpxQS-pYRlRrvDByTULENow-wCSjSyADeGdlSOahwEIeFY_gX-fjukupGA8E123JiptO1S-KVJ7yDDaNNMQj8X_PXxGM01JvrGQyGQfjRiUB2qb-4'); background-size: cover; background-position: center;">
                                    </div>
                                    <div
                                        class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full bg-green-500 ring-2 ring-surface-dark">
                                    </div>
                                </div>
                                <div class="hidden text-left sm:block">
                                    <p
                                        class="text-sm font-semibold text-white group-hover:text-primary transition-colors">
                                        Rami Haddad</p>
                                    <p class="text-xs font-medium text-gray-500">Premium Member</p>
                                </div>
                                <span
                                    class="material-symbols-outlined text-gray-400 group-hover:text-white transition-colors hidden sm:block text-lg">expand_more</span>
                            </button>
                            <!-- Dropdown Menu (Hidden by default, shown here for visualization purposes) -->
                            <!-- In a real app, this would be toggled via JS -->
                            <!-- 
                            <div class="absolute right-0 top-full mt-2 w-48 origin-top-right rounded-lg bg-surface-dark border border-border-dark py-1 shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none z-50" role="menu">
                                <a href="#" class="block px-4 py-2 text-sm text-gray-300 hover:bg-primary/10 hover:text-primary" role="menuitem">Your Profile</a>
                                <a href="#" class="block px-4 py-2 text-sm text-gray-300 hover:bg-primary/10 hover:text-primary" role="menuitem">Settings</a>
                                <a href="#" class="block px-4 py-2 text-sm text-gray-300 hover:bg-primary/10 hover:text-primary" role="menuitem">Sign out</a>
                            </div> 
                            -->
                        </div>
                    </div>
                </div>
            </div>
        </header>

    </div>
</body>

</html>
